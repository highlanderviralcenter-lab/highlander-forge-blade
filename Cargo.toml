[package]
name = "highlander-forge-blade"
version = "3.0.0-alpha.1"
edition = "2021"
authors = ["Highlander Forge <dev@hfb.dev>"]
description = "Manutencao profissional do Windows — engine Rust, UI TUI/GUI"
license = "MIT OR proprietary"
repository = "https://github.com/highlanderviralcenter-lab/highlander-forge-blade"
rust-version = "1.78"

[features]
default = ["tui"]
tui = ["ratatui", "crossterm", "unicode-width"]
gui = ["iced"]
storage = ["blake3", "walkdir", "rayon", "sqlx"]
cloud = ["reqwest"]
security-scan = []

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
unicode-width = { version = "0.1", optional = true }
iced = { version = "0.13", optional = true }
windows = { version = "0.52", features = [
    "Win32_System_Wmi",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_UI_Shell",
    "Win32_Foundation",
]}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "chrono"] }
aes-gcm = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.9", features = ["v4", "serde"] }
semver = "1.0"
anyhow = "1.0"
thiserror = "1.0"
hex = "0.4"
reqwest = { version = "0.12", features = ["json"], optional = true }
blake3 = { version = "1.5", optional = true }
walkdir = { version = "2.5", optional = true }
rayon = { version = "1.10", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
criterion = { version = "0.5", features = ["async_tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1

[[bin]]
name = "hfb"
path = "src/main.rs"
